<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Swarm — Legal</title>
<style>
  :root { --bg:#0a0f0c; --card:#101712; --ink:#e8f5ec; --muted:#9db3a4; --accent:#45e06a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font:17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--card); border:1px solid rgba(69,224,106,.25); border-radius:16px; padding:40px 36px; max-width:480px; width:100%; text-align:center; }
  h1 { font-size:1.6rem; margin-bottom:6px; }
  h1 span { color:var(--accent); }
  p { color:var(--muted); margin-bottom:28px; }
  a.btn { display:block; margin:12px 0; padding:14px 18px; border:1px solid var(--accent); border-radius:10px;
          color:var(--accent); text-decoration:none; font-weight:600; }
  a.btn:hover { background:rgba(69,224,106,.1); }
</style>
</head>
<body>
  <div class="card">
    <h1><span>Star Swarm</span> — Legal</h1>
    <p>Space Survivors · by arrowed</p>
    <a class="btn" href="privacy-policy.html">Privacy Policy</a>
